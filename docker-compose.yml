version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: taskparser_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-taskparser}
      - POSTGRES_USER=${POSTGRES_USER:-taskparser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-1357}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskparser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskparser_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: taskparser_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskparser_network
    restart: unless-stopped

  web:
    build: .
    container_name: taskparser_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://taskparser:1357@db:5432/taskparser
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - POSTGRES_HOST=db
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskparser_network
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: taskparser_celery_beat
    command: celery -A config beat --loglevel=info  # Убрали --scheduler
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://taskparser:1357@db:5432/taskparser
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web
    networks:
      - taskparser_network
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: taskparser_celery_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://taskparser:1357@db:5432/taskparser
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web
    networks:
      - taskparser_network
    restart: unless-stopped

  bot:
    build: .
    container_name: taskparser_bot
    command: python manage.py run_bot
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://taskparser:1357@db:5432/taskparser
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskparser_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  taskparser_network:
    driver: bridge
