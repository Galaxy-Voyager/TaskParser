[tool.poetry]
name = "taskparser"
version = "0.1.0"
description = "Codeforces задач парсер с Telegram ботом"
authors = ["Galaxy Voyager <leheln16@gmail.com>"]
readme = "README.md"
packages = [{include = "config"}, {include = "parser"}, {include = "bot"}, {include = "api"}]

[tool.poetry.dependencies]
python = ">=3.11"
django = ">=5.1,<5.2"
djangorestframework = ">=3.15,<3.16"
psycopg2-binary = ">=2.9.9"
python-telegram-bot = ">=20.0,<21.0"
requests = ">=2.31.0"
celery = ">=5.3.0"
redis = ">=5.0.0"
docker = ">=7.0.0"
apscheduler = ">=3.10.0"
beautifulsoup4 = ">=4.12.0"
lxml = ">=5.0.0"
python-dotenv = ">=1.0.0"
pytz = ">=2024.1"
tzdata = ">=2024.1"
gunicorn = ">=21.2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-django = ">=4.8.0"
pytest-cov = ">=5.0.0"
pytest-mock = ">=3.14.0"
black = ">=24.0.0"
flake8 = ">=7.0.0"
mypy = ">=1.8.0"
pylint = ">=3.0.0"
pre-commit = ">=3.6.0"
coverage = ">=7.4.0"
factory-boy = ">=3.3.0"
faker = ">=24.0.0"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "--cov=. --cov-report=html --cov-report=term"
testpaths = ["tests"]
